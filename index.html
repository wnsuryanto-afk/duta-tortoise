<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      Huruf dipasang SESUDAH halaman selesai dimuat.

      Sebelumnya ia diambil lewat @import di baris pertama src/index.css, dan
      itu memblokir gambar halaman: saat fonts.googleapis.com dimacetkan,
      layarnya kosong sama sekali dan event load tidak pernah terjadi.

      Dipasang di sini lewat window.load — bukan dengan <link media="print">
      — supaya berkasnya tidak ikut dihitung dalam pemuatan halaman sama
      sekali. Huruf sistem dipakai lebih dulu; begitu berkasnya sampai, huruf
      Plus Jakarta Sans menggantikannya (display=swap).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      addEventListener("load", function () {
        var l = document.createElement("link");
        l.rel = "stylesheet";
        l.href = "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap";
        document.head.appendChild(l);
      });
    </script>
    <title>Base44 APP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
