name: CI

# Menjaga cabang utama dan setiap PR: lint, test, lalu build.
# Base44 Builder ikut menerima setiap push ke repo ini, jadi kegagalan yang
# lolos ke main akan langsung terpantul ke aplikasi yang dipakai tim.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
